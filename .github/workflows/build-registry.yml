name: Build registry

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://shark.vini.one
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Registry build
        run: pnpm run registry:build

      - name: Registry drift
        run: |
          git add public/r
          git diff --cached --exit-code -- public/r

      - name: Theme build
        run: pnpm run theme:build

      - name: Theme drift
        run: git diff --exit-code -- styles/themes.css

      - name: Typecheck
        run: pnpm run typecheck
